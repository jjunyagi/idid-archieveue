<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDID Media Archive</title>
    <link rel="icon" type="image/png" href="https://pbs.twimg.com/profile_images/2053815178027003904/1BkSRYIe_400x400.jpg">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        idid: {
                            50: '#eefbfe',
                            100: '#d5f5fc',
                            300: '#7be3f5',
                            400: '#4dc8e9',
                            500: '#23b5dd',
                            600: '#1495bd',
                            700: '#13779a',
                            800: '#16617c',
                            900: '#165068',
                            glow: '#7be3f5'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #091018; }
        ::-webkit-scrollbar-thumb { background: #1e2e3d; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #4dc8e9; }
        .glass-panel {
            background: rgba(9, 16, 24, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(77, 200, 233, 0.12);
        }
        .glass-card {
            background: rgba(15, 23, 36, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(77, 200, 233, 0.08);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            border-color: rgba(77, 200, 233, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(77, 200, 233, 0.2);
        }
        .glow-text { text-shadow: 0 0 12px rgba(77, 200, 233, 0.6); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-idid-400 selection:text-slate-950">

    <!-- Header Navigation -->
    <header class="glass-panel sticky top-0 z-40 border-b border-slate-800/80 px-4 sm:px-8 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full overflow-hidden border border-idid-400/40 shadow-[0_0_12px_rgba(77,200,233,0.3)] bg-slate-900 flex items-center justify-center">
                <img src="https://pbs.twimg.com/profile_images/2053815178027003904/1BkSRYIe_400x400.jpg" alt="IDID Logo" class="w-full h-full object-cover">
            </div>
            <div>
                <h1 class="font-display font-extrabold text-lg tracking-wider text-white glow-text leading-none">IDID</h1>
                <p class="text-[10px] tracking-widest text-idid-400 font-semibold uppercase mt-0.5">MEDIA ARCHIVE</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-xs text-slate-400 font-medium hidden sm:inline-block">Official & Fan Media Vault</span>
            <span class="px-2.5 py-1 rounded-full bg-idid-400/10 border border-idid-400/30 text-[11px] font-bold text-idid-400 flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-idid-400 animate-pulse"></span> Media
            </span>
        </div>
    </header>

    <!-- Main Vault Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
        
        <!-- Filter Controls -->
        <div class="glass-panel p-5 sm:p-6 rounded-2xl border border-slate-800 space-y-4">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h2 class="text-2xl font-display font-bold text-white flex items-center gap-2.5">
                        <i data-lucide="grid" class="w-6 h-6 text-idid-400"></i> Media Vault
                    </h2>
                    <p class="text-slate-400 text-xs sm:text-sm mt-1">Photos, videos, updates, and schedule archives across all platforms.</p>
                </div>

                <div class="flex flex-wrap items-center gap-2.5">
                    <select id="typeFilter" class="bg-slate-900/90 border border-slate-700/80 rounded-xl text-xs px-3 py-2 text-slate-200 focus:outline-none focus:border-idid-400">
                        <option value="ALL">All Platforms</option>
                        <option value="Instagram">Instagram</option>
                        <option value="Twitter">X (Twitter)</option>
                        <option value="YouTube">YouTube</option>
                        <option value="Berriz">Berriz</option>
                        <option value="TikTok">TikTok</option>
                        <option value="Schedule">Schedule</option>
                        <option value="Others">Others</option>
                    </select>

                    <select id="memberFilter" class="bg-slate-900/90 border border-slate-700/80 rounded-xl text-xs px-3 py-2 text-slate-200 focus:outline-none focus:border-idid-400">
                        <option value="ALL">All Members</option>
                        <option value="Jang Yonghoon">Jang Yonghoon</option>
                        <option value="Kim Minjae">Kim Minjae</option>
                        <option value="Park Wonbin">Park Wonbin</option>
                        <option value="Chu Yoochan">Chu Yoochan</option>
                        <option value="Park Seonghyeon">Park Seonghyeon</option>
                        <option value="Baek Junhyuk">Baek Junhyuk</option>
                        <option value="Jeong Semin">Jeong Semin</option>
                        <option value="All">OT7 / Group</option>
                    </select>

                    <select id="sortFilter" class="bg-slate-900/90 border border-slate-700/80 rounded-xl text-xs px-3 py-2 text-slate-200 focus:outline-none focus:border-idid-400">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                    </select>
                </div>
            </div>

            <!-- Search bar -->
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400"></i>
                <input type="text" id="mediaSearch" placeholder="Search caption, tags (#WONBIN), author, or Korean text..." class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl text-xs pl-10 pr-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-idid-400">
            </div>
        </div>

        <!-- Media Feed Grid -->
        <div id="mediaGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
    </main>

    <!-- Modal for Media Playback -->
    <div id="mediaModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel w-full max-w-2xl rounded-2xl border border-slate-800 overflow-hidden shadow-2xl relative flex flex-col max-h-[90vh]">
            <div class="p-3 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <img src="https://pbs.twimg.com/profile_images/2053815178027003904/1BkSRYIe_400x400.jpg" class="w-5 h-5 rounded-full object-cover">
                    <span id="modalAuthor" class="text-xs font-bold text-slate-200">idid.did.idid</span>
                    <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-idid-400 fill-idid-400/20"></i>
                </div>
                <button id="closeModalBtn" class="text-slate-400 hover:text-white p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="modalMediaContainer" class="relative bg-black flex items-center justify-center overflow-hidden max-h-[60vh]"></div>
            <div class="p-4 border-t border-slate-800 space-y-2.5 overflow-y-auto">
                <div class="flex items-center justify-between text-[11px]">
                    <span id="modalDate" class="text-slate-400"></span>
                    <span id="modalType" class="px-2 py-0.5 rounded text-[10px] font-bold bg-idid-400/20 text-idid-300 border border-idid-400/40"></span>
                </div>
                <p id="modalCaption" class="text-xs text-slate-200 leading-relaxed"></p>
                <div id="modalTags" class="flex flex-wrap gap-1 text-[10px] text-idid-400 font-semibold"></div>
            </div>
        </div>
    </div>

    <script>
        const SPREADSHEET_ID = "1txRJ3ZgrTkI3u3ymBYTciXgQ_FWQ0E6Ylvs74Dpw2EI";
        let mediaItems = [];

        async function fetchMediaData() {
            try {
                const response = await fetch(`https://opensheet.elk.sh/${SPREADSHEET_ID}/Media`);
                const data = await response.json();
                
                mediaItems = data.map((item, index) => ({
                    id: index,
                    type: item.type || 'Instagram',
                    author: item.author || 'idid.did.idid',
                    title: item.title || item.caption || '',
                    krTitle: item.kr_title || item.original_text || '',
                    member: item.member || 'All',
                    date: item.date || '2026',
                    mediaUrl: item.media_url || item.image || item.url || '',
                    category: item.category || 'Media',
                    details: item.details || item.tags || ''
                }));

                renderMediaGrid();
            } catch (err) {
                console.error("Failed to fetch Google Sheets data:", err);
            }
        }

        function isVideoUrl(url) {
            if (!url) return false;
            return url.includes('youtube.com') || url.includes('youtu.be') || url.endsWith('.mp4') || url.includes('video') || url.length === 11;
        }

        function renderMediaGrid() {
            const grid = document.getElementById('mediaGrid');
            if (!grid) return;
            grid.innerHTML = '';

            const typeVal = document.getElementById('typeFilter').value;
            const memberVal = document.getElementById('memberFilter').value;
            const sortVal = document.getElementById('sortFilter').value;
            const query = document.getElementById('mediaSearch').value.toLowerCase();

            let filtered = mediaItems.filter(item => {
                const matchesType = typeVal === 'ALL' || item.type.toLowerCase() === typeVal.toLowerCase();
                const matchesMember = memberVal === 'ALL' || item.member.toLowerCase().includes(memberVal.toLowerCase()) || memberVal.toLowerCase().includes(item.member.toLowerCase());
                const matchesQuery = item.title.toLowerCase().includes(query) || 
                                     item.krTitle.toLowerCase().includes(query) || 
                                     item.author.toLowerCase().includes(query) ||
                                     item.details.toLowerCase().includes(query);
                return matchesType && matchesMember && matchesQuery;
            });

            if (sortVal === 'oldest') {
                filtered.reverse();
            }

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 glass-panel rounded-2xl border border-slate-800">
                        <i data-lucide="image-off" class="w-10 h-10 text-slate-600 mx-auto mb-3"></i>
                        <p class="text-sm font-semibold text-slate-400">No media found matching your filter.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "glass-card rounded-2xl border border-slate-800 overflow-hidden flex flex-col justify-between cursor-pointer group";

                const isVideo = isVideoUrl(item.mediaUrl);
                let displayImg = item.mediaUrl;
                
                if (item.mediaUrl.length === 11 && !item.mediaUrl.includes('http')) {
                    displayImg = `https://img.youtube.com/vi/${item.mediaUrl}/hqdefault.jpg`;
                }

                card.innerHTML = `
                    <div class="p-3 border-b border-slate-800/80 flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <img src="https://pbs.twimg.com/profile_images/2053815178027003904/1BkSRYIe_400x400.jpg" class="w-5 h-5 rounded-full object-cover">
                            <span class="text-xs font-bold text-slate-200 truncate max-w-[120px]">${item.author}</span>
                            <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-idid-400 fill-idid-400/20 shrink-0"></i>
                        </div>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-900 border border-slate-700/80 text-slate-300 uppercase">${item.type}</span>
                    </div>

                    <div class="relative aspect-square bg-slate-900 overflow-hidden">
                        <img src="${displayImg}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80'">
                        
                        ${isVideo ? `
                            <div class="absolute top-2.5 right-2.5 p-1.5 rounded-lg bg-slate-950/80 text-idid-400 border border-idid-400/40 shadow-lg">
                                <i data-lucide="video" class="w-4 h-4"></i>
                            </div>` : ''}
                    </div>

                    <div class="p-4 space-y-2.5 flex-1 flex flex-col justify-between">
                        <div>
                            <p class="caption-text text-xs text-slate-200 line-clamp-2 leading-relaxed">${item.title}</p>
                            
                            ${item.krTitle ? `
                                <button class="translate-btn mt-2 text-[10px] font-bold text-idid-400 hover:underline flex items-center gap-1">
                                    <i data-lucide="globe" class="w-3 h-3"></i> Translate / 원문보기
                                </button>` : ''}
                        </div>

                        <div class="pt-2 border-t border-slate-800/60 space-y-1.5">
                            <div class="text-[10px] text-idid-400 font-semibold truncate">${item.details}</div>
                            <div class="flex items-center justify-between text-[10px] text-slate-400">
                                <span>${item.date}</span>
                                <span class="px-1.5 py-0.5 rounded bg-idid-400/10 text-idid-400 font-medium">#${item.category}</span>
                            </div>
                        </div>
                    </div>
                `;

                // Translation toggle handler
                const translateBtn = card.querySelector('.translate-btn');
                if (translateBtn) {
                    let isOriginal = false;
                    translateBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const captionText = card.querySelector('.caption-text');
                        if (!isOriginal) {
                            captionText.innerText = item.krTitle;
                            translateBtn.innerHTML = `<i data-lucide="globe" class="w-3 h-3"></i> Show English`;
                            isOriginal = true;
                        } else {
                            captionText.innerText = item.title;
                            translateBtn.innerHTML = `<i data-lucide="globe" class="w-3 h-3"></i> Translate / 원문보기`;
                            isOriginal = false;
                        }
                        lucide.createIcons();
                    });
                }

                card.addEventListener('click', () => openModal(item));
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function openModal(item) {
            const container = document.getElementById('modalMediaContainer');
            container.innerHTML = '';

            if (item.mediaUrl.length === 11 && !item.mediaUrl.includes('http')) {
                container.innerHTML = `<iframe class="w-full aspect-video" src="https://www.youtube.com/embed/${item.mediaUrl}?autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            } else if (item.mediaUrl.endsWith('.mp4')) {
                container.innerHTML = `<video src="${item.mediaUrl}" controls autoplay class="max-h-[60vh] w-full object-contain"></video>`;
            } else {
                container.innerHTML = `<img src="${item.mediaUrl}" class="max-h-[60vh] w-full object-contain">`;
            }

            document.getElementById('modalAuthor').innerText = item.author;
            document.getElementById('modalDate').innerText = item.date;
            document.getElementById('modalType').innerText = item.type;
            document.getElementById('modalCaption').innerText = item.title;
            document.getElementById('modalTags').innerText = item.details;

            document.getElementById('mediaModal').classList.remove('hidden');
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            fetchMediaData();

            document.getElementById('typeFilter').addEventListener('change', renderMediaGrid);
            document.getElementById('memberFilter').addEventListener('change', renderMediaGrid);
            document.getElementById('sortFilter').addEventListener('change', renderMediaGrid);
            document.getElementById('mediaSearch').addEventListener('input', renderMediaGrid);

            document.getElementById('closeModalBtn').addEventListener('click', () => {
                document.getElementById('mediaModal').classList.add('hidden');
                document.getElementById('modalMediaContainer').innerHTML = '';
            });

            document.getElementById('mediaModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('mediaModal')) {
                    document.getElementById('mediaModal').classList.add('hidden');
                    document.getElementById('modalMediaContainer').innerHTML = '';
                }
            });
        });
    </script>
</body>
</html>
